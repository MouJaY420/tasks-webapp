{% extends 'main/base.html' %}
{% block title %}Delete {{ plan.name }}?{% endblock %}
{% block content %}
  <h2>Are you sure you want to delete {{ plan.name }}?</h2>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'menu:menu_dashboard' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
